<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд | Тень Древних</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #d4af37; margin-bottom: 20px; text-align: center; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .card { background: #1a0a0a; padding: 20px; border-radius: 12px; border-left: 4px solid #d4af37; }
        .card h3 { color: #888; font-size: 14px; margin-bottom: 8px; }
        .card p { font-size: 32px; font-weight: bold; color: #d4af37; }
        .card small { color: #6bbf6b; font-size: 12px; }
        .chart-container { background: #1a0a0a; padding: 20px; border-radius: 12px; border: 1px solid #3a1a1a; }
        canvas { width: 100% !important; height: 300px !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Тень Древних | Дашборд</h1>
        
        <div class="cards">
            <div class="card">
                <h3>Всего игроков</h3>
                <p>{{ total_players }}</p>
                <small>+{{ new_players }} за сутки</small>
            </div>
            <div class="card">
                <h3>Золото в мире</h3>
                <p>{{ total_gold }}</p>
                <small>Общая экономика</small>
            </div>
            <div class="card">
                <h3>Гильдии</h3>
                <p>{{ total_guilds }}</p>
                <small>Активные союзы</small>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;">Онлайн (последние 24 часа)</h3>
            <canvas id="onlineChart"></canvas>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('onlineChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ labels|safe }},
                datasets: [{
                    label: 'Онлайн',
                    data: {{ data|safe }},
                    borderColor: '#d4af37',
                    backgroundColor: 'rgba(212, 175, 55, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#3a1a1a' } },
                    x: { grid: { color: '#3a1a1a' } }
                }
            }
        });
    </script>
</body>
</html>
