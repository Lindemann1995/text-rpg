version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: text_rpg_db
      POSTGRES_USER: text_rpg_user
      POSTGRES_PASSWORD: Harperzore
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text_rpg_user -d text_rpg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8002 config.asgi:application
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: always

volumes:
  prod_postgres_data: